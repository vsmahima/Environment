
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #ffffff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px #cccccc;
        }

        .logo {
            color: #008080;
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #333333;
            margin-left: 20px;
            font-size: 16px;
        }

        nav a:hover {
            color: #008080;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">✚ HealthCare</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Doctors</a>
            <a href="{% url 'login' %}">Login</a>
        </nav>
    </header>

</body>
</html>
